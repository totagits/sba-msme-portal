steps:
  # ── Step 1: Build Backend Docker image ─────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/sba-registry/backend:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/sba-registry/backend:latest'
      - '-f'
      - 'apps/backend/Dockerfile'
      - '.'

  # ── Step 2: Push Backend image ──────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/sba-registry/backend'

  # ── Step 3: Build Frontend Docker image ────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/sba-registry/frontend:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/sba-registry/frontend:latest'
      - '-f'
      - 'apps/frontend/Dockerfile'
      - '--build-arg'
      - 'VITE_API_URL=$_BACKEND_URL/api'
      - '.'

  # ── Step 4: Push Frontend image ─────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    waitFor: ['build-frontend']
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/sba-registry/frontend'

  # ── Step 5: Deploy Backend to Cloud Run ─────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    waitFor: ['push-backend']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sba-backend'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/sba-registry/backend:$COMMIT_SHA'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--port=3001'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--add-cloudsql-instances=$_CLOUD_SQL_CONNECTION'
      - '--set-env-vars=NODE_ENV=production,PORT=3001,JWT_EXPIRES_IN=15m,JWT_REFRESH_EXPIRES_IN=7d,BCRYPT_ROUNDS=12,UPLOAD_DIR=/tmp/uploads,MAX_FILE_SIZE=10485760,DATABASE_URL=$_DATABASE_URL,CORS_ORIGINS=$_FRONTEND_URL'
      - '--set-secrets=JWT_SECRET=jwt-secret:latest,JWT_REFRESH_SECRET=jwt-refresh:latest'
      - '--project=$PROJECT_ID'

  # ── Step 6: Deploy Frontend to Cloud Run ────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sba-frontend'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/sba-registry/frontend:$COMMIT_SHA'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--port=80'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--project=$PROJECT_ID'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/sba-registry/backend:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/sba-registry/backend:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/sba-registry/frontend:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/sba-registry/frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'
