steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/sba-msme-portal-lr/sba-registry/backend:latest'
      - '-f'
      - 'apps/backend/Dockerfile'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/sba-msme-portal-lr/sba-registry/frontend:latest'
      - '-f'
      - 'apps/frontend/Dockerfile'
      - '.'
images:
  - 'us-central1-docker.pkg.dev/sba-msme-portal-lr/sba-registry/backend:latest'
  - 'us-central1-docker.pkg.dev/sba-msme-portal-lr/sba-registry/frontend:latest'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
timeout: '1800s'
